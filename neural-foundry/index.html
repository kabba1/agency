<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081019"><title>Neural Foundry</title><style>html,body{margin:0;background:#081019;color:#e8f4ff;font-family:system-ui,sans-serif}body{display:grid;place-items:center;min-height:100dvh}.b{text-align:center;letter-spacing:.12em}i{display:block;width:34px;height:34px;border:3px solid #1c3448;border-top-color:#43e4ff;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="b"><i></i>BOOTING NEURAL FOUNDRY</div><script>(async()=>{try{let s='';for(const f of ["p0.txt","p1.txt","p2.txt","p3.txt","p4.txt","p5.txt","p6.txt"])s+=await(await fetch(f)).text();const a=Uint8Array.from(atob(s),c=>c.charCodeAt(0)),t=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<p style="padding:24px;max-width:420px">Unable to start. Refresh the page or use the downloadable build.</p>';console.error(e)}})();</script></body></html>
